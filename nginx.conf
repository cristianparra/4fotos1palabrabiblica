server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Tipos MIME estándar + el del manifiesto de la PWA (la imagen base no lo trae).
    include /etc/nginx/mime.types;
    types { application/manifest+json webmanifest; }

    location / {
        try_files $uri $uri/ =404;
    }

    # El service worker nunca debe quedar guardado mucho tiempo, para que las actualizaciones lleguen.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }
}
